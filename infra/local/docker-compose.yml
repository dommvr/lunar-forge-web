services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lunar_forge_web
      POSTGRES_USER: lunar_forge_web
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunar_forge_web -d lunar_forge_web"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - lunar_forge_web_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - lunar_forge_web_redis:/data

volumes:
  lunar_forge_web_postgres:
  lunar_forge_web_redis:
