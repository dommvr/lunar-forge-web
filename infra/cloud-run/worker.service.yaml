apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lunar-forge-web-worker
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "20"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 960
      serviceAccountName: REPLACE_WORKER_SERVICE_ACCOUNT
      containers:
        - image: REPLACE_WORKER_IMAGE
          command: ["lunar-forge-web-worker"]
          ports:
            - containerPort: 8080
          env:
            - name: LUNAR_FORGE_WEB_ENVIRONMENT
              value: production
            - name: LUNAR_FORGE_WEB_SERVICE_ROLE
              value: worker
            - name: LUNAR_FORGE_WEB_TURN_EXECUTION_BACKEND
              value: private_worker
            - name: LUNAR_FORGE_WEB_RUNTIME_BACKEND
              value: e2b
            - name: LUNAR_FORGE_WEB_INFRASTRUCTURE_BACKEND
              value: neon_upstash
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
